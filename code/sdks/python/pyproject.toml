[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iginx-assoc-external-sdk"
version = "1.0.0"
description = "IGinX Assoc External API Python SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
