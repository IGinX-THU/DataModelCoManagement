version: "3.8"

services:
  influxdb:
    image: influxdb:2.0.4
    container_name: igx-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "root"
      DOCKER_INFLUXDB_INIT_PASSWORD: "root1234"
      DOCKER_INFLUXDB_INIT_ORG: "THUIGinX"
      DOCKER_INFLUXDB_INIT_BUCKET: "IGinX"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "IGinX-token-for-you-best-way-ever"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    restart: unless-stopped

volumes:
  influxdb-data:
  influxdb-config:
