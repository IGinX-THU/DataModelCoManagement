server:
  port: 8080

spring:
  application:
    name: iginx-assoc-backend
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/iginx_assoc}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      location: ${ASSOC_UPLOAD_TMP:E:/毕设/基于IGinX的数据与模型智能关联管理系统设计与实现/code/iginx-assoc-backend/storage/tmp}

# IGinX Configuration
iginx:
  host: ${IGINX_HOST:127.0.0.1}
  port: ${IGINX_PORT:6888}
  user: ${IGINX_USER:root}
  password: ${IGINX_PASSWORD:root}
  storage-host-override: ${IGINX_STORAGE_HOST_OVERRIDE:127.0.0.1}
  filesystem:
    enabled: ${IGINX_FS_ENABLED:true}
    auto-register: ${IGINX_FS_AUTO_REGISTER:true}
    host: ${IGINX_FS_HOST:127.0.0.1}
    port: ${IGINX_FS_PORT:6668}
    data-prefix: ${IGINX_FS_DATA_PREFIX:models}
    dir: ${IGINX_FS_DIR:data}
    extra: ${IGINX_FS_EXTRA:}

assoc:
  crypto:
    aes-key: ${ASSOC_AES_KEY:iginx-assoc-dev-key}
  storage:
    model-root: ${ASSOC_MODEL_ROOT:storage}
    data-root: ${ASSOC_DATA_ROOT:storage/data}

# Logging
logging:
  level:
    root: INFO
    com.xmu.iginx.assoc: DEBUG
